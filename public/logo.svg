<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Split Sign Logo: Minimalist mark with clean lines -->
  <defs>
    <style>
      .split-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 14px; fill: #000; }
      .split-mark { stroke: #000; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    </style>
  </defs>
  
  <!-- Vertical split divider (icon concept) -->
  <line x1="55" y1="40" x2="55" y2="120" class="split-mark"/>
  <line x1="145" y1="40" x2="145" y2="120" class="split-mark"/>
  <line x1="55" y1="80" x2="145" y2="80" class="split-mark"/>
  
  <!-- "Split" text below mark -->
  <text x="100" y="155" text-anchor="middle" class="split-text">SPLIT</text>
</svg>
